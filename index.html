<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel - Reconhecimento Facial</title>
  <style>
    :root {
      --bg-principal: #12093a;
      --bg-cards: rgba(255, 255, 255, 0.04);
      --border-cards: rgba(255, 255, 255, 0.08);
      --neon-azul: #00f2fe;
      --neon-verde: #10b981;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg-principal); margin: 0; padding: 0; display: flex; min-height: 100vh; color: white; box-sizing: border-box; }
    .sidebar { width: 260px; background: rgba(0, 0, 0, 0.2); border-right: 1px solid var(--border-cards); padding: 25px 15px; display: flex; flex-direction: column; box-sizing: border-box; }
    .sidebar-titulo { font-size: 18px; font-weight: bold; margin-bottom: 35px; display: flex; align-items: center; gap: 10px; padding-left: 10px; }
    .sidebar-titulo span { color: var(--neon-azul); font-size: 20px; }
    .menu-btn { background: none; border: none; color: rgba(255, 255, 255, 0.6); padding: 14px 18px; text-align: left; font-size: 15px; font-weight: 600; border-radius: 10px; cursor: pointer; margin-bottom: 8px; transition: all 0.2s; display: flex; align-items: center; gap: 12px; width: 100%; }
    .menu-btn:hover { background: rgba(255, 255, 255, 0.05); color: white; }
    .menu-btn.active { background: #3b82f6; color: white; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
    .conteudo { flex-grow: 1; padding: 40px; box-sizing: border-box; overflow-y: auto; display: flex; flex-direction: column; }
    .aba-painel { display: none; width: 100%; animation: fadeIn 0.3s ease-out forwards; }
    .aba-painel.active { display: block; }
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .card-metrica { background: var(--bg-cards); border: 1px solid var(--border-cards); backdrop-filter: blur(10px); padding: 22px; border-radius: 16px; display: flex; flex-direction: column; position: relative; }
    .card-label { font-size: 13px; color: rgba(255, 255, 255, 0.5); font-weight: 500; margin-bottom: 5px; }
    .card-valor { font-size: 32px; font-weight: bold; }
    .card-status-ok { color: var(--neon-verde); font-size: 15px; font-weight: bold; display: flex; align-items: center; gap: 6px; margin-top: 5px; }
    .painel-principal { background: var(--bg-cards); border: 1px solid var(--border-cards); border-radius: 20px; padding: 30px; max-width: 600px; width: 100%; margin: 0 auto; text-align: center; backdrop-filter: blur(10px); }
    .video-box { position: relative; width: 100%; aspect-ratio: 4/3; margin: 20px auto; border-radius: 14px; overflow: hidden; background: #000; border: 2px solid rgba(255, 255, 255, 0.1); }
    video, canvas, #previewImg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    #previewImg { transform: none; object-fit: cover; display: none; }
    .form-group { text-align: left; margin-bottom: 18px; }
    label { font-weight: 600; font-size: 13px; color: rgba(255,255,255,0.7); display: block; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border-cards); border-radius: 8px; color: white; box-sizing: border-box; font-size: 15px; }
    input:focus { border-color: var(--neon-azul); outline: none; }
    .btn-acao { background: var(--neon-verde); color: white; border: none; padding: 14px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: opacity 0.2s; margin-top: 10px; }
    .btn-secundario { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-cards); color: white; padding: 10px 20px; font-size: 14px; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: 600; }
    
    .sucesso-overlay { display: none; background: rgba(255, 255, 255, 0.02); border-radius: 16px; padding: 20px; width: 100%; box-sizing: border-box; text-align: left; align-items: center; position: relative; border: 1px solid var(--border-cards); margin-top: 20px; }
    .sucesso-avatar { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 3px solid var(--neon-azul); box-shadow: 0 0 15px var(--neon-azul); margin-right: 20px; }
    .sucesso-texto-box { flex-grow: 1; }
    .boas-vindas { font-size: 13px; color: rgba(255, 255, 255, 0.5); margin: 0; }
    .sucesso-nome { font-size: 22px; font-weight: bold; color: white; margin: 3px 0 0 0; text-transform: uppercase; letter-spacing: 1px; }
    .badge-identificado { background: rgba(16, 185, 129, 0.15); color: var(--neon-verde); border: 1px solid rgba(16, 185, 129, 0.3); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; position: absolute; right: 20px; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-titulo"><span>☉</span> Painel Biométrico</div>
    <button class="menu-btn active" onclick="alternarAbas('painel-dashboard', this)">📊 Dashboard</button>
    <button class="menu-btn" onclick="alternarAbas('painel-cadastro', this)">👤 Cadastrar</button>
    <button class="menu-btn" onclick="alternarAbas('painel-camera', this)">📷 Câmera</button>
  </div>

  <div class="conteudo">
    
    <!-- ABA 1: DASHBOARD -->
    <div id="painel-dashboard" class="aba-painel active">
      <div class="grid-cards">
        <div class="card-metrica">
          <div class="card-label">Status do Sistema</div>
          <div class="card-status-ok">● Operacional</div>
        </div>
        <div class="card-metrica">
          <div class="card-label">Total de Funcionários</div>
          <div class="card-valor" id="dashTotalAlunos">0</div>
        </div>
      </div>
    </div>

    <!-- ABA 2: CADASTRO INTELIGENTE -->
    <div id="painel-cadastro" class="aba-painel">
      <div class="painel-principal">
        <h2 style="margin-top:0;">Banco de Dados Biométrico</h2>
        <div class="form-group">
          <label>ID / Matrícula do Funcionário:</label>
          <input type="text" id="userId" placeholder="Ex: 1025">
        </div>
        <div class="form-group">
          <label>Nome Completo:</label>
          <input type="text" id="userName" placeholder="Ex: João Silva">
        </div>
        
        <div class="video-box">
          <video id="videoCadastro" autoplay playsinline muted></video>
          <img id="previewImg" alt="Preview da Foto">
        </div>
        
        <div class="status-txt" id="statusCadastroTxt">Escolha entre usar a câmera viva ou subir fotos salvas.</div>
        
        <button class="btn-acao" id="btnCapturarCam" onclick="executarCapturaCamera()">Tirar Foto Multi-Ângulo</button>
        <button class="btn-secundario" onclick="document.getElementById('fileInput').click()">Módulo: Enviar Fotos Salvas (Acúmulo)</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="processarFotoArquivoLocal(this)">
      </div>
    </div>

    <!-- ABA 3: CÂMERA DE RECONHECIMENTO -->
    <div id="painel-camera" class="aba-painel">
      <div class="painel-principal">
        <h2 style="margin-top:0;">Check-in Presença</h2>
        <div class="video-box" id="visorReconhecimentoBox">
          <video id="videoReconhecimento" autoplay playsinline muted></video>
          <canvas id="canvas"></canvas>
        </div>
        <div class="status-txt" id="statusReconhecimentoTxt">Carregando inteligência artificial...</div>
        
        <div class="sucesso-overlay" id="sucessoTela">
          <div class="sucesso-container" style="display:flex; width:100%; align-items:center;">
            <img src="https://placeholder.com" class="sucesso-avatar" id="userFoto" alt="Avatar">
            <div class="sucesso-texto-box">
              <p class="boas-vindas">Bem-vindo de volta,</p>
              <div class="sucesso-nome" id="userNome">FUNCIONÁRIO</div>
            </div>
            <div class="badge-identificado">Identificado</div>
          </div>
        </div>
      </div>
    </div>

  </div>

<script src="./dist/face-api.js"></script>
<script>
  // ATENÇÃO: COLe A URL DO SEU APPS SCRIPT TERMINADA EM /exec ENTRE AS ASPAS
  const API_URL_SCRIPT = "SUA_URL_DO_PASSO_1_TERMINADA_EM_EXEC";

  let videoStream = null;
  let baseUsuarios = [];
  let loopIaAtivo = false;
  let contagemFotos = 1;

  async function inicializarIA() {
    try {
      const MODEL_URL = './weights';
      await faceapi.loadTinyFaceDetectorModel(MODEL_URL); 
      await faceapi.loadFaceLandmarkModel(MODEL_URL);
      await faceapi.loadFaceRecognitionModel(MODEL_URL);
      
      let resposta = await fetch(API_URL_SCRIPT, { method: "POST", body: JSON.stringify({ action: "obterBase" }) });
      let json = await resposta.json();
      baseUsuarios = json.dados || [];
      document.getElementById("dashTotalAlunos").innerText = baseUsuarios.length;
      document.getElementById("statusReconhecimentoTxt").innerText = "Redes neurais prontas. Aguardando rosto.";
    } catch (e) {
      console.error("Erro IA: " + e.message);
    }
  }

  function alternarAbas(idAba, botaoMenu) {
    pararCamera();
    document.querySelectorAll('.aba-painel').forEach(aba => aba.classList.remove('active'));
    document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(idAba).classList.add('active');
    botaoMenu.classList.add('active');
    
    document.getElementById("previewImg").style.display = "none";
    document.getElementById("videoCadastro").style.display = "block";
    
    if (idAba === 'painel-camera') {
      ligarCamera("videoReconhecimento");
      loopIaAtivo = true;
      executarLoopReconhecimento();
      } else if (idAba === 'painel-cadastro') {
      ligarCamera("videoCadastro");
    }
  }

  async function ligarCamera(idVideo) {
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 } });
      document.getElementById(idVideo).srcObject = videoStream;
    } catch(err) {
      console.log("Câmera desativada ou sem permissão.");
    }
  }

  function pararCamera() {
    loopIaAtivo = false;
    if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); }
    document.getElementById("sucessoTela").style.display = "none";
    document.getElementById("visorReconhecimentoBox").style.display = "block";
  }

  async function executarLoopReconhecimento() {
    if (!loopIaAtivo) return;
    const video = document.getElementById("videoReconhecimento");
    
    if (video && video.srcObject) {
      const deteccao = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 })).withFaceLandmarks().withFaceDescriptor();
      if (deteccao) {
        let melhorMatch = null;
        let menorDistancia = 1.0;
        
        baseUsuarios.forEach(usuario => {
          usuario.biometria.forEach(vetorSalvo => {
            const dist = faceapi.euclideanDistance(deteccao.descriptor, new Float32Array(vetorSalvo));
            if (dist < menorDistancia && dist < 0.62) { 
              menorDistancia = dist;
              melhorMatch = usuario;
            }
          });
        });

        if (melhorMatch) {
          loopIaAtivo = false;
          pararCamera();
          document.getElementById("userNome").innerText = melhorMatch.nome;
          document.getElementById("sucessoTela").style.display = "flex";
          document.getElementById("visorReconhecimentoBox").style.display = "none";
          
          await fetch(API_URL_SCRIPT, { method: "POST", body: JSON.stringify({ action: "registrarPresenca", nome: melhorMatch.nome }) });
          setTimeout(() => { alternarAbas('painel-dashboard', document.querySelectorAll('.menu-btn')[0]); }, 4000);
          return;
        }
      }
    }
    setTimeout(executarLoopReconhecimento, 600);
  }

  async function processarFotoArquivoLocal(input) {
    const id = document.getElementById("userId").value;
    const nome = document.getElementById("userName").value;
    const txt = document.getElementById("statusCadastroTxt");
    
    if (!id || !nome) { alert("Por favor, digite a matrícula e o nome antes de anexar o arquivo."); input.value=""; return; }
    if (!input.files || !input.files[0]) return;
    
    txt.innerText = "Processando imagem do arquivo localmente...";
    pararCamera();
    
    const arquivo = input.files[0];
    const imgElement = document.getElementById("previewImg");
    imgElement.src = URL.createObjectURL(arquivo);
    imgElement.style.display = "block";
    document.getElementById("videoCadastro").style.display = "none";
    
    imgElement.onload = async function() {
      const deteccao = await faceapi.detectSingleFace(imgElement, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 })).withFaceLandmarks().withFaceDescriptor();
      
      if (deteccao) {
        txt.innerText = "Assinatura extraída! Enviando acúmulo biométrico para a planilha...";
        var stringVetor = JSON.stringify(Array.from(deteccao.descriptor));
        
        let envio = await fetch(API_URL_SCRIPT, { method: "POST", body: JSON.stringify({ action: "salvarCadastro", id: id, nome: nome, biometria: stringVetor }) });
        let resposta = await envio.json();
        
        alert(resposta.msg);
        txt.innerText = "Foto integrada com sucesso ao histórico!";
        input.value = "";
        inicializarIA(); 
      } else {
        alert("A inteligência artificial não conseguiu mapear um rosto claro nesta foto. Escolha outra imagem.");
        txt.innerText = "Erro na varredura do arquivo.";
        input.value = "";
      }
    };
  }

  async function executarCapturaCamera() {
    const video = document.getElementById("videoCadastro");
    const id = document.getElementById("userId").value;
    const nome = document.getElementById("userName").value;
    const btn = document.getElementById("btnCapturarCam");
    const txt = document.getElementById("statusCadastroTxt");
    
    if (!id || !nome) { alert("Preencha a matrícula e o nome."); return; }
    
    txt.innerText = "Escaneando feição " + contagemFotos + "/3...";
    const deteccao = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 })).withFaceLandmarks().withFaceDescriptor();
    
    if (deteccao) {
      var stringVetor = JSON.stringify(Array.from(deteccao.descriptor));
      
      await fetch(API_URL_SCRIPT, { method: "POST", body: JSON.stringify({ action: "salvarCadastro", id: id, nome: nome, biometria: stringVetor }) });
      
      if (contagemFotos === 1) {
        contagemFotos = 2;
        btn.innerText = "2ª Foto: Olhe para a Esquerda";
        txt.innerText = "Primeira foto (Frente) processada! Mova a cabeça levemente para a esquerda.";
      } else if (contagemFotos === 2) {
        contagemFotos = 3;
        btn.innerText = "3ª Foto: Olhe para a Direita";
        txt.innerText = "Segunda foto salva! Mova a cabeça levemente para a direita.";
      } else if (contagemFotos === 3) {
        alert("Lote biométrico integrado com sucesso!");
        document.getElementById("userId").value = "";
        document.getElementById("userName").value = "";
        btn.innerText = "Tirar Foto Multi-Ângulo";
        txt.innerText = "Cadastro completo. Retornando ao painel.";
        contagemFotos = 1;
        inicializarIA();
        alternarAbas('painel-dashboard', document.querySelectorAll('.menu-btn')[0]);
      }
    } else {
      alert("Nenhum rosto focado. Alinhe-se e tente novamente.");
    }
  }

  window.onload = inicializarIA;
