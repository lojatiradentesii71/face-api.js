<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Biometria Autônoma - GitHub Pages</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f3f4f6; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 480px; width: 100%; text-align: center; }
    .video-box { position: relative; width: 100%; max-width: 400px; aspect-ratio: 4/3; margin: 15px auto; border-radius: 8px; overflow: hidden; background: #000; border: 3px solid #e5e7eb; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    .status { font-size: 16px; font-weight: bold; margin: 15px 0; color: #4b5563; min-height: 24px; }
    .btn { background: #10b981; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; display: none; }
    .btn:hover { background: #059669; }
    .form-group { text-align: left; margin-bottom: 15px; display: none; }
    label { font-weight: bold; font-size: 14px; color: #374151; }
    input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; margin-top: 5px; box-sizing: border-box; font-size: 15px; }
  </style>
</head>
<body>

<div class="card">
  <h2 id="titulo">Iniciando Biometria...</h2>
  
  <div class="form-group" id="grupoForm">
    <label>ID / Matrícula:</label>
    <input type="text" id="userId" placeholder="Ex: 1025">
    <label style="margin-top:10px; display:block;">Nome Completo:</label>
    <input type="text" id="userName" placeholder="Ex: João Silva">
  </div>

  <div class="video-box">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="status" id="statusTxt">Carregando motores de IA...</div>
  <button class="btn" id="btnCapturarCam" name="acaoBtn" onclick="executarCapturaCamera()">Capturar Biometria</button>
</div>

<!-- Motores carregados de repositórios oficiais abertos que o GitHub Pages acessa sem restrições -->
<script src="./dist/face-api.js"></script>
<script>
  // COLES ABAIXO O LINK DO WEB APP DO GOOGLE QUE VOCÊ COPIOU NO PASSO 1
  const API_URL_SCRIPT = "https://script.google.com/macros/s/AKfycbyH_W4mUblycuKa_CSXM4il10xsCBkNNUaVoioww3LrGNtfko2Ipmip6bCRH2jeTJQX/exec";

  const urlParams = new URLSearchParams(window.location.search);
  const MODO_ATUAL = urlParams.get('mode') || 'reconhecimento'; 
  const STATUS_TXT = document.getElementById("statusTxt");
  const ACAO_BTN = document.getElementById("acaoBtn");
  let videoStream = null;
  let baseUsuarios = [];
  
  // Variáveis para controle do fluxo multi-ângulo e tempo limite
  let assinaturasCadastro = []; 
  let contagemFotos = 1;
  let cronometroReconhecimento = null;
  let tempoRestante = 10; // 10 segundos de tolerância na tela

  async function iniciarSistema() {
    try {
      STATUS_TXT.innerText = "Carregando redes neurais biométricas...";
      const MODEL_URL = './weights'; // Aponta para a sua pasta real weights
      
      await faceapi.loadTinyFaceDetectorModel(MODEL_URL); 
      await faceapi.loadFaceLandmarkModel(MODEL_URL);
      await faceapi.loadFaceRecognitionModel(MODEL_URL);
      
      if (MODO_ATUAL === "cadastro") {
        document.getElementById("titulo").innerText = "Cadastro Facial Multi-Ângulo";
        document.getElementById("grupoForm").style.display = "block";
        ACAO_BTN.style.display = "block";
        ACAO_BTN.innerText = "1ª Foto: Olhe de Frente";
        STATUS_TXT.innerText = "Preencha os dados e prepare-se.";
      } else {
        document.getElementById("titulo").innerText = "Check-in Presença";
        STATUS_TXT.innerText = "Sincronizando base de dados...";
        
        let resposta = await fetch(API_URL_SCRIPT, { method: "POST", body: JSON.stringify({ action: "obterBase" }) });
        let json = await resposta.json();
        baseUsuarios = json.dados || [];
        STATUS_TXT.innerText = "Posicione seu rosto de frente para a câmera.";
        
        // Inicia a contagem regressiva de 10 segundos
        iniciarContadorTempoLimite();
      }
      iniciarVideo();
    } catch (e) {
      STATUS_TXT.innerText = "Erro na inicialização: " + e.message;
    }
  }

  function iniciarContadorTempoLimite() {
    tempoRestante = 10;
    cronometroReconhecimento = setInterval(() => {
      tempoRestante--;
      if (MODO_ATUAL === "reconhecimento" && STATUS_TXT.style.color !== "rgb(16, 185, 129)") {
        STATUS_TXT.innerText = "Escaneando... Tempo restante: " + tempoRestante + "s";
      }
      
      if (tempoRestante <= 0) {
        clearInterval(cronometroReconhecimento);
        pararVideo();
        STATUS_TXT.innerText = "Erro: Tempo limite esgotado! Rosto não reconhecido.";
        STATUS_TXT.style.color = "#ef4444";
        alert("Falha no reconhecimento. Por favor, tente novamente em um ambiente mais iluminado.");
      }
    }, 1000);
  }

  function pararVideo() {
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
    }
  }

  async function iniciarVideo() {
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 } });
      document.getElementById("video").srcObject = videoStream;
      if (MODO_ATUAL === "reconhecimento") loopReconhecimento();
    } catch(err) {
      STATUS_TXT.innerText = "Acesso à câmera negado ou indisponível.";
    }
  }

  async function loopReconhecimento() {
    if (tempoRestante <= 0) return; // Para o processamento se estourou o tempo
    const video = document.getElementById("video");
    
    if (baseUsuarios.length === 0) {
      STATUS_TXT.innerText = "Nenhuma assinatura biométrica na planilha.";
      clearInterval(cronometroReconhecimento);
      return;
    }

    const deteccao = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 })).withFaceLandmarks().withFaceDescriptor();
    
    if (deteccao) {
      let melhorMatch = { nome: "Desconhecido", distancia: 1.0 };
      
      baseUsuarios.forEach(usuario => {
        // Como o cadastro agora guarda uma lista de arrays, varre as 3 fotos cadastradas da pessoa
        usuario.biometria.forEach(vetorIndividual => {
          const dist = faceapi.euclideanDistance(deteccao.descriptor, new Float32Array(vetorIndividual));
          if (dist < melhorMatch.distancia && dist < 0.62) { 
            melhorMatch = { nome: usuario.nome, distancia: dist };
          }
        });
      });

      if (melhorMatch.nome !== "Desconhecido") {
        clearInterval(cronometroReconhecimento);
        STATUS_TXT.innerText = "Identificado: " + melhorMatch.nome + "!";
        STATUS_TXT.style.color = "#10b981";
        
        await fetch(API_URL_SCRIPT, { method: "POST", body: JSON.stringify({ action: "registrarPresenca", nome: melhorMatch.nome }) });
        alert("Ponto batido com sucesso para: " + melhorMatch.nome);
        pararVideo();
        return; 
      }
    }
    setTimeout(loopReconhecimento, 500); 
  }

  // GERENCIADOR DE CAPTURA MULTI-ÂNGULO (3 FOTOS)
  async function executarCapturaCamera() {
    const video = document.getElementById("videoCadastro");
    const id = document.getElementById("userId").value;
    const nome = document.getElementById("userName").value;
    const btn = document.getElementById("btnCapturarCam");
    const txt = document.getElementById("statusCadastroTxt");
    
    if (!id || !nome) { alert("Preencha a matrícula e o nome."); return; }
    
    txt.innerText = "Escaneando feição " + contagemFotos + "/3...";
    const deteccao = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 })).withFaceLandmarks().withFaceDescriptor();
    
    if (deteccao) {
      var stringVetor = JSON.stringify(Array.from(deteccao.descriptor));
      
      // Envia os dados para o novo Code.gs que organiza as colunas C e D
      await fetch(API_URL_SCRIPT, { method: "POST", body: JSON.stringify({ action: "salvarCadastro", id: id, nome: nome, biometria: stringVetor }) });
      
      if (contagemFotos === 1) {
        contagemFotos = 2;
        btn.innerText = "2ª Foto: Olhe para a Esquerda";
        txt.innerText = "Primeira foto (Frente) salva! Mova a cabeça levemente para a esquerda.";
      } else if (contagemFotos === 2) {
        contagemFotos = 3;
        btn.innerText = "3ª Foto: Olhe para a Direita";
        txt.innerText = "Segunda foto salva! Mova a cabeça levemente para a direita.";
      } else if (contagemFotos === 3) {
        alert("Lote biométrico integrado com sucesso!");
        document.getElementById("userId").value = "";
        document.getElementById("userName").value = "";
        btn.innerText = "Tirar Foto Multi-Ângulo";
        txt.innerText = "Cadastro completo. Retornando ao painel.";
        contagemFotos = 1;
        inicializarIA();
        alternarAbas('painel-dashboard', document.getElementById("btnMenuDash"));
      }
    } else {
      alert("Nenhum rosto focado. Alinhe-se e tente novamente.");
    }
  }

  window.onload = iniciarSistema;
</script>
